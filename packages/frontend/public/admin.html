<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Panel de supervisión</title>
    <style>
      :root {
        --bg: #0f1117;
        --card: #1a1d27;
        --border: #2a2e3a;
        --text: #e8e9ed;
        --muted: #9aa0ad;
        --accent: #4f7cff;
        --ok: #3ddc84;
        --fail: #ff5c5c;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--text);
        font-family: "Segoe UI", Roboto, system-ui, sans-serif;
        padding: 24px;
      }
      h1 {
        font-size: 1.3rem;
        margin: 0 0 4px;
      }
      .subtitle {
        color: var(--muted);
        font-size: 0.9rem;
        margin: 0 0 20px;
      }
      .session-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
        gap: 16px;
      }
      .session-card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 16px;
      }
      .session-card video {
        width: 100%;
        aspect-ratio: 16 / 9;
        border-radius: 8px;
        background: #000;
        margin-bottom: 10px;
      }
      .session-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 8px;
      }
      .session-id {
        font-size: 0.8rem;
        color: var(--muted);
        font-family: monospace;
      }
      .status-badge {
        font-size: 0.75rem;
        font-weight: 600;
        padding: 3px 10px;
        border-radius: 999px;
      }
      .status-badge.in-progress {
        background: rgba(79, 124, 255, 0.15);
        color: var(--accent);
      }
      .status-badge.completed {
        background: rgba(61, 220, 132, 0.15);
        color: var(--ok);
      }
      .status-badge.terminated-by-infraction {
        background: rgba(255, 92, 92, 0.15);
        color: var(--fail);
      }
      .status-badge.lobby {
        background: rgba(154, 160, 173, 0.15);
        color: var(--muted);
      }
      .session-meta {
        font-size: 0.85rem;
        color: var(--muted);
        line-height: 1.6;
        margin-bottom: 10px;
      }
      .cancel-button {
        width: 100%;
        padding: 9px;
        border-radius: 8px;
        border: 1px solid var(--fail);
        background: rgba(255, 92, 92, 0.1);
        color: var(--fail);
        font-weight: 600;
        cursor: pointer;
      }
      .cancel-button:hover {
        background: rgba(255, 92, 92, 0.2);
      }
      .cancel-button:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }
      .empty-state {
        color: var(--muted);
        padding: 40px 0;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <h1>Panel de supervisión</h1>
    <p class="subtitle">Sesiones de examen en vivo. La lista se actualiza cada 4 segundos.</p>
    <div id="sessions" class="session-grid">
      <p class="empty-state">Cargando sesiones…</p>
    </div>

    <script>
      const LIST_REFRESH_MS = 4000;
      const liveSockets = new Map(); // sessionId -> { ws, mediaSource }
      const knownSessionIds = new Set();

      function statusLabel(status) {
        return (
          {
            lobby: "En lobby",
            "in-progress": "En progreso",
            completed: "Completado",
            "terminated-by-infraction": "Anulado",
          }[status] ?? status
        );
      }

      function attachLiveVideo(sessionId, videoEl) {
        if (liveSockets.has(sessionId)) return; // ya conectado
        if (!("MediaSource" in window)) return;

        const mediaSource = new MediaSource();
        videoEl.src = URL.createObjectURL(mediaSource);

        mediaSource.addEventListener("sourceopen", () => {
          let sourceBuffer;
          try {
            sourceBuffer = mediaSource.addSourceBuffer('video/webm; codecs="vp8,opus"');
          } catch {
            return; // codec no soportado por este navegador
          }

          const queue = [];
          function pump() {
            if (queue.length === 0 || sourceBuffer.updating) return;
            try {
              sourceBuffer.appendBuffer(queue.shift());
            } catch {
              /* buffer lleno o error de decodificación: se descarta el chunk */
            }
          }
          sourceBuffer.addEventListener("updateend", pump);

          const wsProto = location.protocol === "https:" ? "wss:" : "ws:";
          const ws = new WebSocket(
            `${wsProto}//${location.host}/ws/admin/live?sessionId=${encodeURIComponent(sessionId)}`,
          );
          ws.binaryType = "arraybuffer";
          ws.addEventListener("message", (event) => {
            queue.push(new Uint8Array(event.data));
            pump();
          });

          liveSockets.set(sessionId, { ws, mediaSource });
        });

        videoEl.play().catch(() => {});
      }

      function detachLiveVideo(sessionId) {
        const entry = liveSockets.get(sessionId);
        if (!entry) return;
        entry.ws.close();
        liveSockets.delete(sessionId);
      }

      async function cancelSession(sessionId) {
        if (!confirm("¿Cancelar este examen? El alumno verá 'Examen suspendido'.")) return;
        await fetch(`/api/sessions/${encodeURIComponent(sessionId)}/cancel`, { method: "POST" });
      }

      function renderSessionCard(s) {
        const card = document.createElement("div");
        card.className = "session-card";
        card.id = `card-${s.sessionId}`;
        card.innerHTML = `
          <video id="video-${s.sessionId}" muted autoplay playsinline></video>
          <div class="session-header">
            <strong>${s.studentId}</strong>
            <span class="status-badge ${s.status}">${statusLabel(s.status)}</span>
          </div>
          <div class="session-meta">
            <div class="session-id">${s.sessionId}</div>
            <div data-field="progress">Pregunta ${s.currentQuestionIndex + 1} / ${s.totalQuestions}</div>
            ${s.terminationReason ? `<div>Motivo: ${s.terminationReason}</div>` : ""}
          </div>
          <button class="cancel-button" ${s.status !== "in-progress" ? "disabled" : ""}>Cancelar examen</button>
        `;
        card.querySelector(".cancel-button").addEventListener("click", () => cancelSession(s.sessionId));
        return card;
      }

      async function refreshSessions() {
        const container = document.getElementById("sessions");
        let sessions;
        try {
          const response = await fetch("/api/sessions");
          sessions = await response.json();
        } catch {
          return; // deja la última vista visible en vez de borrar todo
        }

        if (sessions.length === 0) {
          if (knownSessionIds.size > 0) {
            knownSessionIds.forEach(detachLiveVideo);
            knownSessionIds.clear();
          }
          container.innerHTML = `<p class="empty-state">No hay sesiones activas.</p>`;
          return;
        }

        const currentIds = new Set(sessions.map((s) => s.sessionId));

        // Elimina tarjetas de sesiones que ya no están (evita reconstruir todo el grid).
        knownSessionIds.forEach((id) => {
          if (!currentIds.has(id)) {
            detachLiveVideo(id);
            document.getElementById(`card-${id}`)?.remove();
            knownSessionIds.delete(id);
          }
        });

        if (container.querySelector(".empty-state")) container.innerHTML = "";

        for (const s of sessions) {
          let card = document.getElementById(`card-${s.sessionId}`);
          if (!card) {
            card = renderSessionCard(s);
            container.appendChild(card);
            knownSessionIds.add(s.sessionId);
            attachLiveVideo(s.sessionId, card.querySelector("video"));
          } else {
            card.querySelector('[data-field="progress"]').textContent =
              `Pregunta ${s.currentQuestionIndex + 1} / ${s.totalQuestions}`;
            const badge = card.querySelector(".status-badge");
            badge.className = `status-badge ${s.status}`;
            badge.textContent = statusLabel(s.status);
            const cancelBtn = card.querySelector(".cancel-button");
            cancelBtn.disabled = s.status !== "in-progress";
          }
        }
      }

      refreshSessions();
      setInterval(refreshSessions, LIST_REFRESH_MS);
    </script>
  </body>
</html>
